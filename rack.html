<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Certified Original</title>
<meta name="description" content="Something is hanging on the rack for you.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<body class="welcome">
<main class="stage">
  <span class="mono eyebrow">New arrival, one of one</span>
  <h1>Something is hanging here <em>for you</em>.</h1>
  <p class="lead" id="lead">Look through the rack and pull out the one with your name on it. Careful, there are fakes.</p>

  <div class="rack" id="rack"></div>
  <p class="status" id="status" role="status" aria-live="polite"></p>

  <div class="found" id="found" hidden>
    <h2>Found it, <span class="name">Babe</span>.</h2>
    <p>Mint condition and one of a kind, just like I said. Come on in.</p>
    <a class="cta" href="home.html">Enter</a>
  </div>

  <a class="skip" href="home.html">Skip the rack</a>
</main>

<script src="js/config.js"></script>
<script src="js/player.js"></script>
<script src="js/main.js"></script>

</body>
